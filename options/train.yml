# Run commands from the repository root; paths below are relative to that directory.
seed: 0
output: experiments/preview_guided_stage2_v3

model:
  # Place the pretrained SPyNet Sintel checkpoint here, or set your own weight path.
  # Full-model inference restores SPyNet from the model checkpoint instead.
  spynet_pretrained: weights/spynet_sintel_final-3d2a1287.pth
  num_poles: 8

datasets:
  # Set these paths to your v3 dataset folders and metadata files.
  train:
    lq: data/AdverseWeather_SmoothTVD_v3/train/LQ
    gt: data/AdverseWeather_SmoothTVD_v3/train/GT
    metadata: data/AdverseWeather_SmoothTVD_v3/train_meta_info.txt
    frames: 12
    crop_size: 256
    batch_size: 4
    workers: 4
    enlarge_ratio: 1
    filename_format: 05d
    extension: jpg
  val:
    lq: data/AdverseWeather_SmoothTVD_v3/test/LQ
    gt: data/AdverseWeather_SmoothTVD_v3/test/GT
    metadata: data/AdverseWeather_SmoothTVD_v3/test_meta_info.txt

train:
  total_iter: 150000
  ema_decay: 0.999
  optim_g:
    lr: 0.0001
    weight_decay: 0
    betas: [0.9, 0.999]
  eta_min: 1.0e-07
  fix_flow: 5000
  flow_lr_mul: 0.25
  flow_teacher_schedule: [5001, 6000]
  gradient_clip_norm: 1.0
  lambda_rec: 1.0
  lambda_ssim: 0.05
  lambda_wave_res: 0.1
  lambda_flow: 0.02
  aux_loss_weights:
    pole_separation: 0.001
  energy_ema_decay: 0.99
  energy_floor: 0.0001
  energy_weight_bounds: [0.25, 4.0]
  charbonnier_eps: 1.0e-06

validation:
  interval: 5000
  cpu_offload: true

logging:
  interval: 100
  save_interval: 2500
